name: post
# Instagram Reels are posted at their slot (09:00, 13:00, 16:30, 20:00 and 22:00 IST); Facebook Reels are scheduled natively on Meta.
# Cron is UTC. GitHub delayed scheduled runs by up to about 5 hours on this quiet repo, so it runs every 30 minutes
# in the posting window to get many chances; a late run still posts what is due, never twice.
# About 31 runs a day is about 930 minutes a month: a private repo has 2,000 free minutes.
on:
  schedule:
    - cron: "*/30 3-17 * * *"   # every 30 min, 08:30 to 23:00 IST: covers the 09:00, 13:00, 16:30, 20:00 and 22:00 IST slots
    - cron: "0 20 * * *"        # 01:30 IST: finish scheduling Facebook Reels
  workflow_dispatch: {}

concurrency:
  group: post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post due Instagram Reels
        run: node post-due.mjs
      - name: Schedule remaining Facebook Reels
        run: node fb-schedule.mjs --limit 4
      - name: Delete videos that are done everywhere
        run: node prune.mjs
      - name: Save state
        run: |
          git config user.name "clip-poster"
          git config user.email "clip-poster@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git pull --rebase -q && git push -q)
