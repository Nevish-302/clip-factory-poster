name: post
# Instagram Reels are posted at their slot (13:00 and 20:00 IST); Facebook Reels are scheduled natively on Meta.
# Cron is UTC and GitHub may delay it by 10+ minutes; a late run still posts what is due, never twice.
# Few runs per day on purpose: a private repo has 2,000 free minutes a month.
on:
  schedule:
    - cron: "35 7 * * *"    # 13:05 IST
    - cron: "5 8 * * *"     # 13:35 IST (retry)
    - cron: "35 14 * * *"   # 20:05 IST
    - cron: "5 15 * * *"    # 20:35 IST (retry)
    - cron: "0 20 * * *"    # 01:30 IST: finish scheduling Facebook Reels
  workflow_dispatch: {}

concurrency:
  group: post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post due Instagram Reels
        run: node post-due.mjs
      - name: Schedule remaining Facebook Reels
        run: node fb-schedule.mjs --limit 4
      - name: Delete videos that are done everywhere
        run: node prune.mjs
      - name: Save state
        run: |
          git config user.name "clip-poster"
          git config user.email "clip-poster@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git pull --rebase -q && git push -q)
